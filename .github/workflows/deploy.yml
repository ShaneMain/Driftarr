# Deploy workflow — copy this to your own repo and configure secrets
# See docs/server-setup.md for required GitHub Secrets
#
# To enable: remove the `if: false` line below and add your secrets
name: Deploy

on:
  push:
    branches: [main]
    # Config-only auto-export pushes (configs/data/) must not spin up a deploy
    # runner — deploy.sh skips them anyway, so this avoids a wasted Tailscale
    # join + SSH. Apply manual config edits with workflow_dispatch.
    paths-ignore:
      - 'configs/data/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false  # Template only — remove this line after configuring secrets
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          # Wait for Tailscale connectivity to the deploy target
          for i in 1 2 3 4 5; do
            if tailscale ping --timeout=5s ${{ secrets.DEPLOY_HOST }} >/dev/null 2>&1; then
              echo "Tailscale connectivity confirmed"
              break
            fi
            echo "Waiting for Tailscale connectivity... (attempt $i)"
            sleep 3
          done

          # Pre-scan the host key (retry in case of transient failure)
          for i in 1 2 3; do
            if ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
              if [ -s ~/.ssh/known_hosts ]; then
                echo "Host key scanned successfully"
                break
              fi
            fi
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep 2
          done

          # Load the key into the agent so it's never written to disk
          eval "$(ssh-agent -s)"
          echo "$SSH_KEY" | ssh-add -

          ssh -o RequestTTY=no \
              deploy@${{ secrets.DEPLOY_HOST }} 2>&1
