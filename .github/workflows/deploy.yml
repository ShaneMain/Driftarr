# Deploy workflow — copy this to your own repo and configure secrets
# See docs/server-setup.md for required GitHub Secrets
#
# To enable: replace the `if: false` line below with the gate condition shown
# next to it, and add your secrets.
#
# Gated on Validate: this workflow fires when Validate completes on main and
# only deploys if it passed. Config-only auto-export pushes never run Validate
# (paths-ignore there), so they never reach here either. Manual runs via
# workflow_dispatch skip the gate.
name: Deploy

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Least privilege: deploy reaches the server over Tailscale/SSH and uses no
# GITHUB_TOKEN write scopes.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Template only — after configuring secrets, replace with:
    # if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    if: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        # Secrets are passed through env, never interpolated into the script
        # body, so a value containing shell metacharacters can't become code.
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh

          # Wait for Tailscale connectivity to the deploy target (fail fast:
          # proceeding without it just dies later with a cryptic SSH error)
          ts_ok=false
          for i in 1 2 3 4 5; do
            if tailscale ping --timeout=5s "$DEPLOY_HOST" >/dev/null 2>&1; then
              echo "Tailscale connectivity confirmed"
              ts_ok=true
              break
            fi
            echo "Waiting for Tailscale connectivity... (attempt $i)"
            sleep 3
          done
          if [ "$ts_ok" != true ]; then
            echo "::error::No Tailscale connectivity to deploy target after 5 attempts"
            exit 1
          fi

          # Pre-scan the host key (retry in case of transient failure)
          scan_ok=false
          for i in 1 2 3; do
            if ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              if [ -s ~/.ssh/known_hosts ]; then
                echo "Host key scanned successfully"
                scan_ok=true
                break
              fi
            fi
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep 2
          done
          if [ "$scan_ok" != true ]; then
            echo "::error::ssh-keyscan failed after 3 attempts"
            exit 1
          fi

          # Load the key into the agent so it's never written to disk
          eval "$(ssh-agent -s)"
          echo "$SSH_KEY" | ssh-add -

          # The server's authorized_keys `command=` / sshd ForceCommand runs
          # deploy.sh regardless of what is requested here, so send an explicit
          # token anyway: if the forced command is ever lost, a plain shell
          # fails on "deploy: command not found" instead of exiting 0 on EOF.
          # Belt and braces: also require one of the pipeline's known end-of-run
          # lines — the summary banner (deploy/90-summary.sh) or an intentional
          # early exit (deploy/00-pull.sh) — so a silent no-op can't go green.
          set -o pipefail
          ssh -o RequestTTY=no "deploy@$DEPLOY_HOST" deploy 2>&1 | tee deploy-output.log
          if ! grep -qE 'Deploy Summary|nothing to deploy|skipping deploy' deploy-output.log; then
            echo "::error::deploy.sh produced no recognisable output — the forced command did not run on the server"
            exit 1
          fi
