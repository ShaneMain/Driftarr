name: Validate

on:
  push:
    branches: [main]
    # Config-only auto-export pushes (configs/data/) don't need validation.
    paths-ignore:
      - 'configs/data/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          for f in $(find . -name 'docker-compose.yml'); do
            echo "Validating $f..."
            docker compose -f "$f" --env-file .env.example config --quiet
          done
          echo "✅ All compose files validated"

      - name: Report services without healthchecks
        run: |
          # Informational only: the deploy health gate can only see containers
          # that define a healthcheck — services without one pass silently.
          missing=0
          for f in $(find . -name 'docker-compose.yml' ! -path './docker-compose.yml'); do
            json=$(docker compose -f "$f" --env-file .env.example config --format json 2>/dev/null) || continue
            no_hc=$(echo "$json" | jq -r '.services | to_entries[] | select(.value.healthcheck == null) | .key' 2>/dev/null)
            if [ -n "$no_hc" ]; then
              echo "⚠️  $f:"
              echo "$no_hc" | sed 's/^/      /'
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::Some services lack healthchecks — the deploy health gate cannot see them"
          else
            echo "✅ All services define healthchecks"
          fi

      - name: Check .env.example documents all compose variables
        run: |
          # A ${VAR} with no default interpolates to empty when unset — compose
          # only warns. Validation above runs against .env.example, so a
          # referenced variable that is absent from it silently validates and
          # would deploy a container with an empty secret/path. Require the
          # template to document every no-default variable.
          mapfile -t vars < <(find . -name docker-compose.yml -print0 \
            | xargs -0 grep -hE '\$\{' 2>/dev/null \
            | grep -vE '^[[:space:]]*#' \
            | grep -oE '\$\{[A-Z_][A-Z0-9_]*(\}|:\?[^}]*\})' \
            | sed -E 's/\$\{([A-Z_][A-Z0-9_]*).*/\1/' | sort -u)
          missing=""
          for v in "${vars[@]}"; do
            grep -qE "^${v}=" .env.example || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::compose variables with no default are missing from .env.example:$missing"
            exit 1
          fi
          echo "✅ .env.example documents all ${#vars[@]} no-default compose variables"

      - name: Validate shell script syntax
        run: |
          # Every tracked shell script, not just deploy/ — pre-deploy hooks and
          # cron-invoked scripts were previously unchecked.
          while read -r f; do
            bash -n "$f" && echo "  ✅ $f"
          done < <(git ls-files -- '*.sh')
          echo "✅ All shell scripts syntax OK"

      - name: Check script executable bits
        run: |
          # A script that a cron job or a deploy hook invokes but that is 644 in
          # the index reproduces a broken file on every checkout — it fails with
          # "Permission denied" and its whole job silently stops working. Fail
          # here so that never reaches the server.
          crontab_refs=""
          [ -f crontab ] && crontab_refs=$(cat crontab)
          rc=0
          while read -r mode _hash _stage path; do
            need_exec=0
            case "$path" in
              *pre-deploy.sh|*post-deploy.sh) need_exec=1 ;;
              *)
                if [ -n "$crontab_refs" ] && printf '%s' "$crontab_refs" | grep -qF -- "$path"; then
                  need_exec=1
                fi
                ;;
            esac
            if [ "$need_exec" = 1 ] && [ "$mode" != 100755 ]; then
              echo "::error::$path is mode $mode in the index but must be executable (100755)"
              rc=1
            fi
          done < <(git ls-files -s -- '*.sh')
          [ "$rc" = 0 ] && echo "✅ script executable bits OK"
          exit $rc

      - name: Validate Python syntax
        run: |
          python3 -m py_compile configs/sync/base.py
          python3 -m py_compile configs/sync/sync.py
          python3 -m py_compile configs/sync/export.py
          for f in configs/sync/modules/*.py; do
            [ -f "$f" ] && python3 -m py_compile "$f"
          done
          echo "✅ Python syntax OK"

      - name: Run config-sync engine tests
        run: |
          # The sync engine performs destructive live-API writes (a missing
          # collection file means delete-all), so a logic regression must not
          # reach a deploy just because the sources still compile.
          [ -d tests ] || { echo "no tests/ directory — skipping"; exit 0; }
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: Check file structure
        run: |
          echo "Checking required files..."
          for f in deploy.sh common.yml .env.example docker-compose.yml; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "Checking deploy modules..."
          for f in deploy/lib.sh deploy/00-pull.sh deploy/10-detect.sh deploy/20-deploy.sh deploy/90-summary.sh; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "Checking stacks..."
          for d in media downloads; do
            [ -f "$d/docker-compose.yml" ] && echo "  ✅ $d/docker-compose.yml" || { echo "  ❌ $d/docker-compose.yml missing"; exit 1; }
          done

          echo "Checking configs..."
          for f in configs/__init__.py configs/Dockerfile configs/sync/__init__.py configs/sync/base.py configs/sync/sync.py configs/sync/export.py configs/sync/modules/__init__.py; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "✅ Structure valid"
