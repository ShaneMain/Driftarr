name: Validate

on:
  push:
    branches: [main]
    # Config-only auto-export pushes (configs/data/) don't need validation.
    paths-ignore:
      - 'configs/data/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          for f in $(find . -name 'docker-compose.yml'); do
            echo "Validating $f..."
            docker compose -f "$f" --env-file .env.example config --quiet
          done
          echo "✅ All compose files validated"

      - name: Report services without healthchecks
        run: |
          # Informational only: the deploy health gate can only see containers
          # that define a healthcheck — services without one pass silently.
          missing=0
          for f in $(find . -name 'docker-compose.yml' ! -path './docker-compose.yml'); do
            json=$(docker compose -f "$f" --env-file .env.example config --format json 2>/dev/null) || continue
            no_hc=$(echo "$json" | jq -r '.services | to_entries[] | select(.value.healthcheck == null) | .key' 2>/dev/null)
            if [ -n "$no_hc" ]; then
              echo "⚠️  $f:"
              echo "$no_hc" | sed 's/^/      /'
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::Some services lack healthchecks — the deploy health gate cannot see them"
          else
            echo "✅ All services define healthchecks"
          fi

      - name: Validate deploy scripts
        run: |
          bash -n deploy.sh
          for f in deploy/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "  ✅ $f"
          done
          echo "✅ All deploy scripts syntax OK"

      - name: Validate Python syntax
        run: |
          python3 -m py_compile configs/sync/base.py
          python3 -m py_compile configs/sync/sync.py
          python3 -m py_compile configs/sync/export.py
          for f in configs/sync/modules/*.py; do
            [ -f "$f" ] && python3 -m py_compile "$f"
          done
          echo "✅ Python syntax OK"

      - name: Run config-sync engine tests
        run: |
          # The sync engine performs destructive live-API writes (a missing
          # collection file means delete-all), so a logic regression must not
          # reach a deploy just because the sources still compile.
          [ -d tests ] || { echo "no tests/ directory — skipping"; exit 0; }
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: Check file structure
        run: |
          echo "Checking required files..."
          for f in deploy.sh common.yml .env.example docker-compose.yml; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "Checking deploy modules..."
          for f in deploy/lib.sh deploy/00-pull.sh deploy/10-detect.sh deploy/20-deploy.sh deploy/90-summary.sh; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "Checking stacks..."
          for d in media downloads; do
            [ -f "$d/docker-compose.yml" ] && echo "  ✅ $d/docker-compose.yml" || { echo "  ❌ $d/docker-compose.yml missing"; exit 1; }
          done

          echo "Checking configs..."
          for f in configs/__init__.py configs/Dockerfile configs/sync/__init__.py configs/sync/base.py configs/sync/sync.py configs/sync/export.py configs/sync/modules/__init__.py; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "✅ Structure valid"
