name: Validate

on:
  push:
    branches: [main]
    # Config-only auto-export pushes (configs/data/) don't need validation.
    paths-ignore:
      - 'configs/data/**'
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight validation.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan for leaked secrets (gitleaks)
        run: |
          # Defense in depth alongside .gitignore and GitHub's own push
          # protection: scans the pushed code for API keys, tokens, and private
          # keys. --no-git because the CI checkout is shallow (fetch-depth 1) —
          # scan the actual working tree, and yield stable path-based fingerprints
          # for .gitleaksignore (SHA-based fingerprints change every push). Pinned
          # binary (not gitleaks-action) for a self-contained, version-pinned scan.
          # A release tag is mutable, so the asset's SHA-256 is pinned too —
          # bump GLVER and GLSHA together (sha256 from the release's
          # gitleaks_<ver>_checksums.txt).
          set -o pipefail
          GLVER=v8.30.1
          GLSHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ASSET="gitleaks_${GLVER#v}_linux_x64.tar.gz"
          curl -sSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/${GLVER}/${ASSET}"
          echo "${GLSHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source=. --no-banner --redact --verbose --no-git
          echo "✅ No leaked secrets detected"

      - name: Validate compose files
        run: |
          for f in $(find . -name 'docker-compose.yml'); do
            dir=$(dirname "$f")
            # A stack may reference an env_file that is gitignored (server-only
            # secrets, e.g. plane.env). `config` needs the file to exist to
            # parse, so create an empty stub by basename in the stack dir.
            for ef in $(grep -oE '[A-Za-z0-9._/-]+\.env\b' "$f" | grep -v '\.env\.example$' || true); do
              base=$(basename "$ef")
              [ -f "$dir/$base" ] || : > "$dir/$base"
            done
            echo "Validating $f..."
            docker compose -f "$f" --env-file .env.example config --quiet
          done
          echo "✅ All compose files validated"

      - name: Report services without healthchecks
        run: |
          # Informational only: the deploy health gate can only see containers
          # that define a healthcheck — services without one pass silently.
          missing=0
          for f in $(find . -name 'docker-compose.yml' ! -path './docker-compose.yml'); do
            json=$(docker compose -f "$f" --env-file .env.example config --format json 2>/dev/null) || continue
            no_hc=$(echo "$json" | jq -r '.services | to_entries[] | select(.value.healthcheck == null) | .key' 2>/dev/null)
            if [ -n "$no_hc" ]; then
              echo "⚠️  $f:"
              echo "$no_hc" | sed 's/^/      /'
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::Some services lack healthchecks — the deploy health gate cannot see them"
          else
            echo "✅ All services define healthchecks"
          fi

      - name: Check .env.example documents all compose variables
        run: |
          # A ${VAR} with no default interpolates to empty when unset — compose
          # only warns. Validation above runs against .env.example, so a
          # referenced variable that is absent from it silently validates and
          # would deploy a container with an empty secret/path. Require the
          # template to document every no-default variable.
          mapfile -t vars < <(find . -name docker-compose.yml -print0 \
            | xargs -0 grep -hE '\$\{' 2>/dev/null \
            | grep -vE '^[[:space:]]*#' \
            | grep -oE '\$\{[A-Z_][A-Z0-9_]*(\}|:\?[^}]*\})' \
            | sed -E 's/\$\{([A-Z_][A-Z0-9_]*).*/\1/' | sort -u)
          missing=""
          for v in "${vars[@]}"; do
            grep -qE "^${v}=" .env.example || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::compose variables with no default are missing from .env.example:$missing"
            exit 1
          fi
          echo "✅ .env.example documents all ${#vars[@]} no-default compose variables"

      - name: Report memory budget
        run: |
          # Informational: sum declared mem_limits against HOST_MEM_MB (if set
          # in .env.example) so every PR shows the memory ledger. Uncapped
          # services don't appear here but can still OOM the host.
          total=$(find . -name docker-compose.yml -print0 \
            | xargs -0 grep -hE '^[[:space:]]*mem_limit:' 2>/dev/null \
            | sed -E 's/.*mem_limit:[[:space:]]*"?([0-9]+)([mMgG]).*/\1 \2/' \
            | awk '{ if (tolower($2)=="g") s+=$1*1024; else s+=$1 } END { print s+0 }')
          capped=$(find . -name docker-compose.yml -print0 \
            | xargs -0 grep -hcE '^[[:space:]]*mem_limit:' 2>/dev/null | awk '{s+=$1} END{print s+0}')
          echo "Declared mem_limit: ${capped} services, ${total} MB total"
          host_mb=$(grep -E '^HOST_MEM_MB=' .env.example 2>/dev/null | cut -d= -f2)
          if [ -n "$host_mb" ] && [ "$host_mb" -gt 0 ] 2>/dev/null; then
            echo "Host memory (HOST_MEM_MB): ${host_mb} MB"
            if [ "$total" -gt "$host_mb" ]; then
              echo "::warning::declared mem_limit total (${total} MB) exceeds HOST_MEM_MB (${host_mb} MB)"
            fi
          fi

      - name: Validate shell script syntax
        run: |
          # Every tracked shell script, not just deploy/ — pre-deploy hooks and
          # cron-invoked scripts were previously unchecked.
          # Note: `bash -n "$f" && echo` would exempt the failure from errexit,
          # so collect an explicit flag instead.
          rc=0
          while read -r f; do
            if bash -n "$f"; then
              echo "  ✅ $f"
            else
              echo "::error::$f failed bash -n"
              rc=1
            fi
          done < <(git ls-files -- '*.sh')
          [ "$rc" = 0 ] && echo "✅ All shell scripts syntax OK"
          exit $rc

      - name: Check script executable bits
        run: |
          # A script that a cron job or a deploy hook invokes but that is 644 in
          # the index reproduces a broken file on every checkout — it fails with
          # "Permission denied" and its whole job silently stops working. Fail
          # here so that never reaches the server.
          crontab_refs=""
          # Only real cron entries count — header comments may name scripts in prose.
          [ -f crontab ] && crontab_refs=$(grep -Ev '^\s*(#|$)' crontab || true)
          rc=0
          while read -r mode _hash _stage path; do
            need_exec=0
            case "$path" in
              *pre-deploy.sh|*post-deploy.sh|.githooks/*|scripts/secret-guard.sh) need_exec=1 ;;
              *)
                if [ -n "$crontab_refs" ] && printf '%s' "$crontab_refs" | grep -qF -- "$path"; then
                  need_exec=1
                fi
                ;;
            esac
            if [ "$need_exec" = 1 ] && [ "$mode" != 100755 ]; then
              echo "::error::$path is mode $mode in the index but must be executable (100755)"
              rc=1
            fi
          done < <(git ls-files -s -- '*.sh' '.githooks/*')
          [ "$rc" = 0 ] && echo "✅ script executable bits OK"
          exit $rc

      - name: Validate Python syntax
        run: |
          python3 -m py_compile configs/sync/base.py
          python3 -m py_compile configs/sync/sync.py
          python3 -m py_compile configs/sync/export.py
          for f in configs/sync/modules/*.py; do
            [ -f "$f" ] && python3 -m py_compile "$f"
          done
          echo "✅ Python syntax OK"

      - name: Lint Python (ruff)
        run: |
          # Catches unused imports, undefined names, and import-order drift
          # across the sync engine and tests. Config lives in pyproject.toml —
          # intentionally scoped to defaults + import sorting (E4/E7/E9/F/I) so
          # it surfaces real bugs, not line-length noise.
          python3 -m pip install --quiet ruff
          ruff check configs/ tests/
          echo "✅ ruff lint OK"

      - name: Run config-sync engine tests
        run: |
          # The sync engine performs destructive live-API writes (a missing
          # collection file means delete-all), so a logic regression must not
          # reach a deploy just because the sources still compile.
          [ -d tests ] || { echo "no tests/ directory — skipping"; exit 0; }
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: Run deploy pipeline tests (bats)
        run: |
          [ -d tests/deploy ] || { echo "no tests/deploy — skipping"; exit 0; }
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          bats tests/deploy/
          if [ -d tests/guard ]; then bats tests/guard/; fi

      - name: Check file structure
        run: |
          echo "Checking required files..."
          for f in deploy.sh common.yml .env.example docker-compose.yml; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "Checking deploy modules..."
          for f in deploy/lib.sh deploy/00-pull.sh deploy/10-detect.sh deploy/20-deploy.sh deploy/90-summary.sh; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "Checking stacks..."
          for d in media downloads; do
            [ -f "$d/docker-compose.yml" ] && echo "  ✅ $d/docker-compose.yml" || { echo "  ❌ $d/docker-compose.yml missing"; exit 1; }
          done

          echo "Checking configs..."
          for f in configs/__init__.py configs/Dockerfile configs/sync/__init__.py configs/sync/base.py configs/sync/sync.py configs/sync/export.py configs/sync/modules/__init__.py; do
            [ -f "$f" ] && echo "  ✅ $f" || { echo "  ❌ $f missing"; exit 1; }
          done

          echo "✅ Structure valid"
